<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-orange-400 to-yellow-500 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">🎮 2048</h1>
      <button onclick="window.location.href='../index.html'" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition-colors">
        ← Quay lại
      </button>
    </div>

    <!-- Score -->
    <div class="flex gap-4 mb-6">
      <div class="flex-1 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg p-4 text-center">
        <div class="text-white/80 text-sm font-semibold">ĐIỂM</div>
        <div id="score" class="text-white text-2xl font-bold">0</div>
      </div>
      <div class="flex-1 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-lg p-4 text-center">
        <div class="text-white/80 text-sm font-semibold">TỐT NHẤT</div>
        <div id="best-score" class="text-white text-2xl font-bold">0</div>
      </div>
    </div>

    <!-- Game Board -->
    <canvas id="gameCanvas" class="bg-gray-300 rounded-xl p-2 mb-6 flex flex-wrap gap-2 justify-center items-center">
      <!-- Grid will be generated by JavaScript -->
    </canvas>

    <!-- Controls -->
    <div class="text-center">
      <button id="new-game" class="bg-gradient-to-r from-green-500 to-teal-500 hover:from-green-600 hover:to-teal-600 text-white font-bold py-3 px-8 rounded-lg transition-all transform hover:scale-105 shadow-lg">
        🔄 Game Mới
      </button>
      <p class="text-gray-600 mt-4 text-sm">
        Dùng phím mũi tên ⬆️⬇️⬅️➡️ để di chuyển
      </p>
    </div>

    <!-- Game Over Overlay -->
    <div id="game-over" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
      <div class="bg-white rounded-2xl p-8 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Game Over!</h2>
        <p class="text-xl text-gray-600 mb-6">Điểm: <span id="final-score" class="font-bold text-purple-600">0</span></p>
        <button id="resetBtn" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 px-8 rounded-lg hover:from-purple-600 hover:to-pink-600">
          Chơi lại
        </button>
      </div>
    </div>
  </div>

  <script src="../js/games/2048.js"></script>
</body>
</html>
